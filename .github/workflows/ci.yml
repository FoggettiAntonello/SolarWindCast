name: Python checks and portfolio

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SOLARWINDCAST_RUN_CACHED_TIMESTRAL: '0'
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install CPU dependencies (no model weights)
        shell: pwsh
        run: |
          python -m pip install -c constraints.txt pip==26.2.2 setuptools==78.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -c constraints.txt torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -c constraints.txt -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependencies, unit tests and Ruff
        shell: pwsh
        run: ./scripts/check.ps1 -PythonPath (Get-Command python).Source
      - name: Installed synthetic demo without weights or token
        shell: pwsh
        run: |
          python -B -m solarwindcast.backtest_demo --config configs/project.yaml --profile step8 --baselines-only --output "$env:RUNNER_TEMP/solarwindcast-demo"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Public-file audit and standalone website
        shell: pwsh
        run: |
          python -B -m solarwindcast.publication --require-license --site-output "$env:RUNNER_TEMP/solarwindcast-site" --source-repo-url "https://github.com/${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
