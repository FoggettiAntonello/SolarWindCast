name: Deploy portfolio to Azure Free

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12.10'
      - name: Install only the static publisher dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate and stage approved assets
        run: python -B -m solarwindcast.publication --require-license --site-output build/site --source-repo-url "https://github.com/${{ github.repository }}"
      - name: Publish static files (no API backend)
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: build/site
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
