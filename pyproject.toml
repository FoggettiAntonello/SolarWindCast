[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solarwindcast"
version = "1.0.0"
description = "Short-term renewable generation forecasting for the Italian South market zone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
    "pyarrow==26.0.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    "holidays==0.107",
    "entsoe-py==0.8.1",
    "torch==2.11.0",
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "scikit-learn==1.9.1"]
analysis = [
    "ipykernel==7.4.0", "jupyter==1.1.1",
    "lightgbm==4.7.0",
]

[project.scripts]
solarwindcast-demo = "solarwindcast.backtest_demo:main"
solarwindcast-inspect = "solarwindcast.real_data_report:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["solarwindcast*"]
namespaces = false

[tool.setuptools.package-data]
solarwindcast = ["assets/*.svg", "assets/*.png"]

[tool.ruff]
target-version = "py312"
required-version = "==0.17.3"
extend-exclude = ["archive", "data", "reports", ".venv"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "B", "UP", "SIM",
    "BLE001", "TRY004", "RUF007", "RUF100",
    "D100", "D104", "ANN001", "ANN201", "ANN202",
]
